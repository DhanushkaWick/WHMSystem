trigger:
  - main

pool:
  name: 'Selenium-Windows-Pool'

variables:
  MAVEN_OPTS: '-Xmx3072m'

steps:

  # ==========================================
  # 1. Checkout source code
  # ==========================================
  - checkout: self
    displayName: 'Checkout Selenium Automation Code'


  # ==========================================
  # 2. Check Java, Maven and Chrome
  # ==========================================
  - script: |
      java -version
      mvn -version
      chrome --version
    displayName: 'Check Java, Maven and Chrome Versions'


  # ==========================================
  # 3. Run Selenium + TestNG tests
  #    Visible Chrome - NOT headless
  # ==========================================
  - task: Maven@4
    displayName: 'Run Selenium TestNG Automation'
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'clean test'
      options: '-Dbrowser=chrome -Dheadless=false'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '1.17'
      jdkArchitectureOption: 'x64'
      mavenVersionOption: 'Default'
      publishJUnitResults: false


  # ==========================================
  # 4. Publish TestNG/Surefire results
  # ==========================================
  - task: PublishTestResults@2
    displayName: 'Publish Selenium Test Results'
    condition: always()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      mergeTestResults: true
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: false
      testRunTitle: 'WHMSystem Selenium TestNG Results'


  # ==========================================
  # 5. Publish Allure Results
  # ==========================================
  - task: PublishPipelineArtifact@1
    displayName: 'Publish Allure Results'
    condition: and(always(), exists('$(System.DefaultWorkingDirectory)/target/allure-results'))
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/target/allure-results'
      artifact: 'allure-results'
      publishLocation: 'pipeline'