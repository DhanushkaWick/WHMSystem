trigger:
- main

pool:
  vmImage: 'windows-latest'

steps:

# ==========================================
# JAVA 17
# ==========================================

- task: JavaToolInstaller@0
  displayName: 'Use Java 17'
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'


# ==========================================
# VERIFY JAVA
# ==========================================

- powershell: |
    Write-Host "======================================"
    Write-Host "JAVA VERSION"
    Write-Host "======================================"

    java -version
    javac -version
    mvn -version

  displayName: 'Verify Java and Maven'


# ==========================================
# RUN SELENIUM TESTNG
# ==========================================

- powershell: |
    Write-Host "======================================"
    Write-Host "RUNNING SELENIUM TESTNG TESTS"
    Write-Host "======================================"

    mvn clean test

  displayName: 'Run Selenium TestNG Tests'


# ==========================================
# SHOW TEST RESULT FILES
# ==========================================

- powershell: |
    Write-Host "======================================"
    Write-Host "TEST RESULT FILES"
    Write-Host "======================================"

    if (Test-Path "$(System.DefaultWorkingDirectory)\target\surefire-reports") {

        Get-ChildItem `
          "$(System.DefaultWorkingDirectory)\target\surefire-reports" `
          -Recurse

    }
    else {

        Write-Host "ERROR: target/surefire-reports does not exist"

    }

  displayName: 'Check Surefire Reports'
  condition: succeededOrFailed()


# ==========================================
# PUBLISH TEST RESULTS
# ==========================================

- task: PublishTestResults@2
  displayName: 'Publish TestNG Results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/target/surefire-reports/TEST-*.xml'
    searchFolder: '$(System.DefaultWorkingDirectory)'
    mergeTestResults: true
    testRunTitle: 'Selenium TestNG Automation Tests'
    failTaskOnFailedTests: false
