trigger:
- main

pool:
  vmImage: 'windows-latest'

steps:

- task: JavaToolInstaller@0
  displayName: 'Set Java 17'
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- powershell: |
    Write-Host "======================================"
    Write-Host "JAVA TEST STARTED"
    Write-Host "======================================"

    Write-Host "JAVA_HOME:"
    Write-Host $env:JAVA_HOME

    Write-Host "JAVA VERSION:"
    java -version

    Write-Host "JAVAC VERSION:"
    javac -version

    Write-Host "JAVA LOCATION:"
    where.exe java

    Write-Host "JAVAC LOCATION:"
    where.exe javac

    Write-Host "MAVEN LOCATION:"
    where.exe mvn

    Write-Host "MAVEN VERSION:"
    mvn -version

    Write-Host "======================================"
    Write-Host "JAVA TEST FINISHED"
    Write-Host "======================================"
  displayName: 'JAVA TEST'

- powershell: |
    Write-Host "===== BUILD AND TEST ====="
    mvn clean test
  displayName: 'Run Selenium TestNG Tests'
