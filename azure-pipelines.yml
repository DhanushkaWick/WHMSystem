steps:

- task: JavaToolInstaller@0
  displayName: 'Set Java 17'
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- powershell: |
    Write-Host "===== JAVA_HOME ====="
    Write-Host $env:JAVA_HOME

    Write-Host "===== JAVA ====="
    java -version

    Write-Host "===== JAVAC ====="
    javac -version

    Write-Host "===== JAVA PATH ====="
    where.exe java

    Write-Host "===== JAVAC PATH ====="
    where.exe javac

    Write-Host "===== MAVEN ====="
    mvn -version

    Write-Host "===== MAVEN COMPILER ====="
    mvn help:evaluate -Dexpression=maven.compiler.release -q -DforceStdout
  displayName: 'Diagnose Java and Maven'

- task: Maven@4
  displayName: 'Run Maven Tests'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean test'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
