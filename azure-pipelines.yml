trigger:
- main

pool:
  vmImage: 'windows-latest'

steps:

- task: JavaToolInstaller@0
  displayName: 'Set Java 17'
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- powershell: |
    Write-Host "===== JAVA_HOME ====="
    Write-Host $env:JAVA_HOME

    Write-Host "===== JAVA VERSION ====="
    java -version

    Write-Host "===== JAVAC VERSION ====="
    javac -version

    Write-Host "===== JAVA LOCATION ====="
    where.exe java

    Write-Host "===== JAVAC LOCATION ====="
    where.exe javac

    Write-Host "===== MAVEN VERSION ====="
    mvn -version
  displayName: 'Verify Java and Maven'

- powershell: |
    $env:JAVA_HOME = $env:JAVA_HOME
    $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

    java -version
    javac -version
    mvn -version

    mvn clean install
  displayName: 'Build and Run Tests'
