trigger:
- main

pool:
  vmImage: 'windows-latest'

steps:

- task: JavaToolInstaller@0
  displayName: 'Install Java 17'
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- powershell: |
    Write-Host "===== JAVA HOME ====="
    Write-Host $env:JAVA_HOME

    Write-Host "===== JAVA ====="
    java -version

    Write-Host "===== JAVAC ====="
    javac -version

    Write-Host "===== JAVA LOCATION ====="
    where.exe java

    Write-Host "===== JAVAC LOCATION ====="
    where.exe javac

    Write-Host "===== MAVEN ====="
    mvn -version
  displayName: 'Check Java 17 and Maven'

- powershell: |
    Write-Host "===== BUILD ====="
    mvn clean test
  displayName: 'Run Selenium TestNG Tests'
