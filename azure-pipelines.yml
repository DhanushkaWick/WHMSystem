trigger:
- main

pool:
  vmImage: 'windows-latest'

steps:

- powershell: |
    Write-Host "===== FIND INSTALLED JDKs ====="

    Get-ChildItem "C:\hostedtoolcache\windows\Java" -Directory -Recurse |
      Where-Object { $_.FullName -match "jdk.*17.*x64" } |
      Select-Object -ExpandProperty FullName

    Write-Host "===== FIND JAVA.EXE ====="

    Get-ChildItem "C:\hostedtoolcache\windows\Java" -Filter java.exe -Recurse |
      Select-Object -ExpandProperty FullName
  displayName: 'Find Java installations'


- powershell: |
    $java17 = Get-ChildItem "C:\hostedtoolcache\windows\Java" -Directory -Recurse |
      Where-Object { $_.FullName -match "jdk.*17.*x64" } |
      Select-Object -First 1

    if ($null -eq $java17) {
        Write-Error "Java 17 was not found on the agent."
        exit 1
    }

    Write-Host "Java 17 found at:"
    Write-Host $java17.FullName

    $env:JAVA_HOME = $java17.FullName

    # Put Java 17 FIRST in PATH
    $env:PATH = "$($java17.FullName)\bin;$env:PATH"

    Write-Host "===== JAVA_HOME ====="
    Write-Host $env:JAVA_HOME

    Write-Host "===== JAVA ====="
    java -version

    Write-Host "===== JAVAC ====="
    javac -version

    Write-Host "===== JAVA LOCATION ====="
    where.exe java

    Write-Host "===== JAVAC LOCATION ====="
    where.exe javac

    Write-Host "===== MAVEN ====="
    mvn -version

    Write-Host "===== MAVEN COMPILER VERSION ====="
    mvn compiler:help -Ddetail
  displayName: 'Force Maven to Java 17'


- powershell: |
    $java17 = Get-ChildItem "C:\hostedtoolcache\windows\Java" -Directory -Recurse |
      Where-Object { $_.FullName -match "jdk.*17.*x64" } |
      Select-Object -First 1

    $env:JAVA_HOME = $java17.FullName
    $env:PATH = "$($java17.FullName)\bin;$env:PATH"

    Write-Host "Running Maven with:"
    java -version
    javac -version
    mvn -version

    mvn clean test
  displayName: 'Build and Run Selenium TestNG'
